name: Build skill bundles

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty to skip GitHub release — bundles are still uploaded as workflow artifacts.'
        required: false
        type: string
      environments:
        description: 'Environments to build (comma-separated). Default builds all four.'
        required: false
        default: 'dev,demo,uat,www'
        type: string

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read skill versions from SKILL.md frontmatter
        id: ver
        run: |
          set -euo pipefail
          get_ver() { awk '/^version:/ { gsub(/[",]/,"",$2); print $2; exit }' "$1"; }
          {
            echo "deposit=$(get_ver MetaComp-Deposit/SKILL.md)"
            echo "withdrawal=$(get_ver MetaComp-Withdrawal/SKILL.md)"
            echo "swap=$(get_ver MetaComp-Swap/SKILL.md)"
            echo "wealth=$(get_ver MetaComp-Wealth/SKILL.md)"
            echo "visionx_claude=$(get_ver 'MetaComp-VisionX/Skill for Claude/SKILL.md')"
            echo "visionx_openclaw=$(get_ver 'MetaComp-VisionX/Skill for OpenClaw/SKILL.md')"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Build bundles per environment
        env:
          DEPOSIT_VER: ${{ steps.ver.outputs.deposit }}
          WITHDRAWAL_VER: ${{ steps.ver.outputs.withdrawal }}
          SWAP_VER: ${{ steps.ver.outputs.swap }}
          WEALTH_VER: ${{ steps.ver.outputs.wealth }}
          VISIONX_CLAUDE_VER: ${{ steps.ver.outputs.visionx_claude }}
          VISIONX_OPENCLAW_VER: ${{ steps.ver.outputs.visionx_openclaw }}
          ENVS: ${{ inputs.environments }}
        run: |
          set -euo pipefail
          mkdir -p dist
          IFS=',' read -ra ENV_LIST <<< "$ENVS"
          for env in "${ENV_LIST[@]}"; do
            env=$(echo "$env" | xargs)
            [[ -z "$env" ]] && continue
            echo "::group::Build $env"

            stage="build/$env"
            inner="$stage/_inner"
            rm -rf "$stage"
            mkdir -p "$inner"

            # Copy + rename each skill into a flat staging directory.
            # Folder names inside the zip match the SKILL.md `name:` field so
            # install paths line up (e.g. ~/.openclaw/workspace/skills/MetaComp-VisionX-OpenClaw).
            cp -r MetaComp-Deposit                                "$stage/MetaComp-Deposit"
            cp -r MetaComp-Withdrawal                             "$stage/MetaComp-Withdrawal"
            cp -r MetaComp-Swap                                   "$stage/MetaComp-Swap"
            cp -r MetaComp-Wealth                                 "$stage/MetaComp-Wealth"
            cp -r "MetaComp-VisionX/Skill for Claude"           "$stage/MetaComp-VisionX-Claude"
            cp -r "MetaComp-VisionX/Skill for OpenClaw"           "$stage/MetaComp-VisionX-OpenClaw"

            # Strip macOS metadata files before zipping.
            find "$stage" \( -name ".DS_Store" -o -name "__MACOSX" \) -exec rm -rf {} + 2>/dev/null || true

            # Environment URL substitution.
            #   - Replace https://demo.metacomp.ai (with any path) -> https://<env>.metacomp.ai
            #   - Leaves untouched: npm package "@metacomp/visionx-kyt-mcp",
            #     connector names "metacomp mcp" / "metacomp-mcp",
            #     plain-text "metacomp.ai" (brand mention, no scheme),
            #     and "https://camp.mce.sg" (Wealth investor declaration, different domain).
            find "$stage" -type f \( -name "*.md" -o -name "*.txt" -o -name "*.json" -o -name "*.yml" -o -name "*.yaml" \) \
              -exec sed -i "s|https://demo\.metacomp\.ai|https://${env}.metacomp.ai|g" {} +

            # Inner zips: one per skill, name = <skill>-<env>-<version>.zip
            (cd "$stage" && zip -qr "_inner/MetaComp-Deposit-${env}-${DEPOSIT_VER}.zip"                   MetaComp-Deposit)
            (cd "$stage" && zip -qr "_inner/MetaComp-Withdrawal-${env}-${WITHDRAWAL_VER}.zip"            MetaComp-Withdrawal)
            (cd "$stage" && zip -qr "_inner/MetaComp-Swap-${env}-${SWAP_VER}.zip"                        MetaComp-Swap)
            (cd "$stage" && zip -qr "_inner/MetaComp-Wealth-${env}-${WEALTH_VER}.zip"                    MetaComp-Wealth)
            (cd "$stage" && zip -qr "_inner/MetaComp-VisionX-Claude-${env}-${VISIONX_CLAUDE_VER}.zip"    MetaComp-VisionX-Claude)
            (cd "$stage" && zip -qr "_inner/MetaComp-VisionX-OpenClaw-${env}-${VISIONX_OPENCLAW_VER}.zip" MetaComp-VisionX-OpenClaw)

            # Outer bundle: flat zip of the 6 inner zips
            (cd "$inner" && zip -qj "$GITHUB_WORKSPACE/dist/metacomp-skills-${env}.zip" *.zip)

            ls -la "dist/metacomp-skills-${env}.zip"
            echo "::endgroup::"
          done

      - name: Write build summary
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "## Built bundles"
            echo
            for f in dist/*.zip; do
              echo "### \`$(basename "$f")\`"
              echo
              echo '```'
              unzip -l "$f"
              echo '```'
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-bundles
          path: dist/*.zip
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
