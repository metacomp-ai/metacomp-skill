name: Build skill bundles

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty to skip GitHub release — bundles are still uploaded as workflow artifacts.'
        required: false
        type: string
      environments:
        description: 'Environments to build (comma-separated). Default builds all five.'
        required: false
        default: 'dev,demo,uat,prod,sandbox'
        type: string

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build per-environment zips
        env:
          ENVS: ${{ inputs.environments }}
        run: |
          set -euo pipefail
          chmod +x build.sh
          IFS=',' read -ra ENV_LIST <<< "$ENVS"
          for env in "${ENV_LIST[@]}"; do
            env=$(echo "$env" | xargs)
            [[ -z "$env" ]] && continue
            echo "::group::Build $env"
            ./build.sh "$env"
            echo "::endgroup::"
          done

      - name: Write build summary
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "## Built zips"
            echo
            for f in dist/*/MetaComp-*.zip; do
              echo "### \`$(basename "$f")\`"
              echo
              echo '```'
              unzip -l "$f"
              echo '```'
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-bundles
          path: dist/*/MetaComp-*.zip
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: dist/*/MetaComp-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
