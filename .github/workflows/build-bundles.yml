name: Build skill bundles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from SKILL.md
        id: version
        run: |
          set -euo pipefail
          VERSION="$(awk '/^version:/ { gsub(/[",]/,"",$2); print $2; exit }' MetaComp/SKILL.md)"
          [[ -n "$VERSION" ]] || { echo "Error: no version found in MetaComp/SKILL.md" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION tag=v$VERSION"

      - name: Build per-environment zips
        run: |
          set -euo pipefail
          chmod +x build.sh
          for env in dev demo uat prod sandbox; do
            echo "::group::Build $env"
            ./build.sh "$env"
            echo "::endgroup::"
          done

      - name: Write build summary
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "## Built zips"
            echo
            for f in dist/*/MetaComp-*.zip; do
              echo "### \`$(basename "$f")\`"
              echo
              echo '```'
              unzip -l "$f"
              echo '```'
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-bundles
          path: dist/*/MetaComp-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/*/MetaComp-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
